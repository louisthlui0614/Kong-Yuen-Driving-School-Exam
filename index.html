<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>港緣駕駛學院 - 網上預約系統</title>
    <style>
        /* 保留原有的 CSS 基礎設定 */
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: "Microsoft JhengHei", sans-serif; color: #1a1a1a; background-color: #fdfaf2; margin: 0; line-height: 1.6; }
        .navbar { background-color: #fffdec; border-bottom: 3px solid #e6c229; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .nav-logo { font-size: 16pt; font-weight: bold; }
        .nav-links { display: flex; gap: 20px; list-style: none; margin: 0; padding: 0; }
        .nav-links a { text-decoration: none; color: #333; font-weight: bold; transition: color 0.2s; }
        .btn-admin { background-color: #333; color: #ebdca5 !important; padding: 6px 12px; border-radius: 4px; }
        .hero { background: linear-gradient(135deg, #ebdca5 0%, #fdfaf2 100%); padding: 60px 5%; text-align: center; border-bottom: 1px solid #ebdca5; }
        .booking-section { padding: 40px 5%; }
        .section-title { text-align: center; font-size: 20pt; margin-bottom: 30px; }
        .form-container { max-width: 600px; margin: 0 auto; background-color: #fff; border: 2px solid #e6c229; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 11pt; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 11pt; }
        .form-group input[readonly] { background-color: #f0f0f0; cursor: not-allowed; color: #555; }
        .btn-submit { width: 100%; background-color: #e6c229; color: #000; border: none; padding: 12px; font-size: 12pt; font-weight: bold; border-radius: 4px; cursor: pointer; }
        footer { text-align: center; padding: 20px; color: #666; font-size: 9pt; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-logo">港緣駕駛學院</div>
        <ul class="nav-links">
            <li><a href="admin.html" class="btn-admin" target="_blank">進入職員後台</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>考試預約系統</h1>
        <p>請填寫以下資料以預約您的駕駛考試</p>
    </header>

    <section class="booking-section">
        <div class="form-container">
            <form id="appointmentForm" onsubmit="handleBooking(event)">
                <div class="form-group">
                    <label for="hkid">身份證號碼 (首4個字元，例：A123) *</label>
                    <input type="text" id="hkid" required placeholder="例如：A123" maxlength="4">
                </div>

                <div class="form-group">
                    <label for="name">中文姓名 *</label>
                    <input type="text" id="name" required placeholder="例如：陳大文">
                </div>
                
                <div class="form-group">
                    <label for="exam_type">預約考試項目 *</label>
                    <select id="exam_type" required>
                        </select>
                </div>

                <div class="form-group">
                    <label>傳動系統</label>
                    <input type="text" value="自動波" readonly>
                </div>

                <div class="form-group">
                    <label for="exam_date">考試日期 *</label>
                    <input type="date" id="exam_date" required>
                </div>

                <div class="form-group">
                    <label for="exam_time">考試時間段 *</label>
                    <select id="exam_time" required>
                        </select>
                </div>

                <button type="submit" class="btn-submit">提交預約申請</button>
            </form>
        </div>
    </section>

    <footer>&copy; 2026 港緣駕駛學院</footer>

    <script>
        // 頁面載入時，從 LocalStorage 讀取 admin 設定的選項
        window.onload = function() {
            // 預設資料 (如果 admin 還沒設定)
            const defaultExams = ['輕型貨車合併試', '私家車合併試', '的士筆試'];
            const defaultTimes = ['09:00 - 10:00', '11:00 - 12:00', '14:30 - 15:30'];

            const savedExams = JSON.parse(localStorage.getItem('adminExams')) || defaultExams;
            const savedTimes = JSON.parse(localStorage.getItem('adminTimes')) || defaultTimes;

            // 渲染選項
            const examSelect = document.getElementById('exam_type');
            savedExams.forEach(exam => {
                examSelect.innerHTML += `<option value="${exam}">${exam}</option>`;
            });

            const timeSelect = document.getElementById('exam_time');
            savedTimes.forEach(time => {
                timeSelect.innerHTML += `<option value="${time}">${time}</option>`;
            });
        };

        function handleBooking(event) {
            event.preventDefault();
            
            const hkid = document.getElementById('hkid').value.toUpperCase();
            const name = document.getElementById('name').value;
            const examType = document.getElementById('exam_type').value;
            const examDate = document.getElementById('exam_date').value;
            const examTime = document.getElementById('exam_time').value;

            // 1. 儲存預約記錄
            const newBooking = { hkid, name, examType, examDate, examTime, submitTime: new Date().toLocaleString() };
            let bookings = JSON.parse(localStorage.getItem('bookings')) || [];
            bookings.push(newBooking);
            localStorage.setItem('bookings', JSON.stringify(bookings));

            // 2. 更新/新增學員資訊 (供後台管理)
            let students = JSON.parse(localStorage.getItem('students')) || {};
            if(!students[hkid]) {
                // 如果是新生，建立預設檔案
                students[hkid] = { 
                    hkid: hkid, 
                    name: name, 
                    licenseClass: examType, 
                    status: '有效' 
                };
            }
            localStorage.setItem('students', JSON.stringify(students));

            alert(`預約成功！\n${name} 同學，你已預約 ${examDate} ${examTime} 的 ${examType}。`);
            document.getElementById('appointmentForm').reset();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>港緣駕駛學院</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;700&display=swap');

        body { font-family: 'Noto Sans HK', sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; color: #333; }
        
        /* Header - 手機版調整 */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px 5%; background: #eef6ff; border-bottom: 2px solid #dbeafe; 
        }

        .logo-container img { height: 40px; }
        .topbar a { margin-left: 15px; text-decoration: none; color: #555; font-weight: 600; }
        
        /* Intro - 圖片全螢幕關鍵 */
        .intro { padding: 50px 5%; text-align: center; background: white; }
        .intro h1 { color: #003366; font-size: 2rem; }
        
        /* 圖片放大至全螢幕關鍵：移除 max-width，寬度設為 100% */
        .intro img { 
            width: 100%; 
            height: auto; 
            display: block; 
            margin: 30px 0; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.15); 
        }
        
        /* Features - 響應式排版 (手機變直排) */
        .features { 
            display: flex; flex-wrap: wrap; justify-content: center; 
            padding: 40px 5%; gap: 20px; background: #f4f7f6; 
        }
        .feature-item { text-align: center; flex: 1 1 250px; }
        .feature-item h3 { color: #003366; }

        .btn-reserve { 
            display: inline-block; padding: 15px 30px; background: #ff6600; color: white; 
            text-decoration: none; border-radius: 50px; font-weight: bold; 
        }

        footer { padding: 40px; background: #003366; color: white; text-align: center; font-size: 0.9rem; }
        
        /* 電腦版寬螢幕修正 */
        @media (min-width: 1024px) {
            header { padding: 20px 80px; }
            .intro img { border-radius: 0; } /* 如果想要真正的無邊框全寬 */
            .features { padding: 60px 80px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-link">
            <div class="logo-container">
                <img src="logo.png" alt="Logo">
            </div>
        </a>
        <nav class="topbar">
            <a href="index.html">首頁</a>
            <a href="booking.html">網上預約</a>
        </nav>
    </header>

    <section class="intro">
        <h1>專業駕駛 啟航未來</h1>
        <p>港緣駕駛學院致力於提供專業、安全的駕駛培訓服務。<br>擁有資深教練團隊及現代化教學設施，助您順利考取駕駛執照。</p>
        
        <img src="background.png" alt="學院簡介圖片">
        
        <a href="booking.html" class="btn-reserve">立即預約考試</a>
    </section>

    <section class="features">
        <div class="feature-item">
            <h3>經驗豐富教練</h3>
            <p>每位教練均擁有多年的教學經驗，針對不同學員需求提供細心指導。</p>
        </div>
        <div class="feature-item">
            <h3>現代化車隊</h3>
            <p>採用全新訓練車輛，並配備最新安全輔助系統，確保教學質素。</p>
        </div>
        <div class="feature-item">
            <h3>靈活預約制度</h3>
            <p>支援網上預約與即時查核，讓學員更有效安排練習時間。</p>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 港緣駕駛學院. All Rights Reserved.</p>
    </footer>

</body>
</html>

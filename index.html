<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>港緣駕駛學院 - 網上預約系統</title>
    <style>
        /* 保留原有的 CSS 基礎設定 */
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: "Microsoft JhengHei", sans-serif; color: #1a1a1a; background-color: #fdfaf2; margin: 0; line-height: 1.6; }
        .navbar { background-color: #fffdec; border-bottom: 3px solid #e6c229; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .nav-logo { font-size: 16pt; font-weight: bold; }
        .nav-links { display: flex; gap: 20px; list-style: none; margin: 0; padding: 0; }
        .nav-links a { text-decoration: none; color: #333; font-weight: bold; transition: color 0.2s; }
        .btn-admin { background-color: #333; color: #ebdca5 !important; padding: 6px 12px; border-radius: 4px; }
        .hero { background: linear-gradient(135deg, #ebdca5 0%, #fdfaf2 100%); padding: 60px 5%; text-align: center; border-bottom: 1px solid #ebdca5; }
        .booking-section { padding: 40px 5%; }
        .section-title { text-align: center; font-size: 20pt; margin-bottom: 30px; }
        .form-container { max-width: 600px; margin: 0 auto; background-color: #fff; border: 2px solid #e6c229; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 11pt; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 11pt; }
        .form-group input[readonly] { background-color: #f0f0f0; cursor: not-allowed; color: #555; }
        .btn-submit { width: 100%; background-color: #e6c229; color: #000; border: none; padding: 12px; font-size: 12pt; font-weight: bold; border-radius: 4px; cursor: pointer; }
        footer { text-align: center; padding: 20px; color: #666; font-size: 9pt; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-logo">港緣駕駛學院</div>
        <ul class="nav-links">
            <li><a href="admin.html" class="btn-admin" target="_blank">進入職員後台</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>考試預約系統</h1>
        <p>請填寫以下資料以預約您的駕駛考試</p>
    </header>

    <section class="booking-section" id="booking">
        <h2 class="section-title">學車網上預約</h2>
        <div class="form-container">
            <form id="appointmentForm" onsubmit="handleBooking(event)">
                <div class="form-group">
                    <label for="name">中文姓名 *</label>
                    <input type="text" id="name" required placeholder="例如：陳大文">
                </div>
                
                <div class="form-group">
                    <label for="id_card">身份證號碼 *</label>
                    <input type="text" id="id_card" required placeholder="例如：A123456(7)" pattern="^[A-Z]{1,2}[0-9]{6}\([0-9A-Z]\)$" title="請輸入完整的香港身份證號碼，格式如 A123456(7)">
                </div>
                
                <div class="form-group">
                    <label for="phone">電話號碼 *</label>
                    <input type="tel" id="phone" required placeholder="例如：91234567" pattern="[0-9]{8}">
                </div>

                <div class="form-group">
                    <label for="exam_type">預約考試 *</label>
                    <select id="exam_type" required>
                        <option value="輕型貨車 - 丙部路試">輕型貨車 - 丙部路試</option>
                        <option value="私家車 - 丙部路試">私家車 - 丙部路試</option>
                        <option value="輕型貨車 - 合併試">輕型貨車 - 合併試</option>
                        <option value="私家車 - 合併試">私家車 - 合併試</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>傳動系統 *</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gear_type" value="自動波" checked> 自動波</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>預約考試時段 *</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="date" id="exam_date" required style="width: 45%;">
                        <select id="exam_time_slot" required style="width: 55%;">
                            </select>
                    </div>
                </div>

                <button type="submit" class="btn-submit">提交預約申請</button>
            </form>
        </div>
    </section>

    <footer>&copy; 2026 港緣駕駛學院</footer>

    <script>
        <script>
        // 頁面載入時，自動從 localStorage 讀取後台設定的時間段
        window.addEventListener('DOMContentLoaded', () => {
            loadTimeSlots();
        });

        function loadTimeSlots() {
            const timeSlotSelect = document.getElementById('exam_time_slot');
            // 如果後台還沒設定，給予預設時間段
            const defaultSlots = ["09:00 - 12:00", "13:00 - 16:00", "18:00 - 21:00"];
            const savedSlots = JSON.parse(localStorage.getItem('admin_time_slots')) || defaultSlots;
            
            timeSlotSelect.innerHTML = '';
            savedSlots.forEach(slot => {
                const option = document.createElement('option');
                option.value = slot;
                option.textContent = slot;
                timeSlotSelect.appendChild(option);
            });
        }

        function handleBooking(event) {
            event.preventDefault();
            
            const name = document.getElementById('name').value;
            const id_card = document.getElementById('id_card').value.toUpperCase(); // 強制轉大寫
            const phone = document.getElementById('phone').value;
            const exam_type = document.getElementById('exam_type').value;
            const gear = document.querySelector('input[name="gear_type"]:checked').value;
            const exam_date = document.getElementById('exam_date').value;
            const exam_time_slot = document.getElementById('exam_time_slot').value;

            // 建立預約紀錄物件
            const newBooking = {
                id: Date.now(),
                name,
                id_card,
                phone,
                exam_type,
                gear,
                date: exam_date,
                time: exam_time_slot,
                timestamp: new Date().toLocaleString()
            };

            // 儲存預約紀錄到 localStorage
            let bookings = JSON.parse(localStorage.getItem('admin_bookings')) || [];
            bookings.push(newBooking);
            localStorage.setItem('admin_bookings', JSON.stringify(bookings));

            // 同步自動更新或新增到學員資訊（若該身份證未存在過）
            let students = JSON.parse(localStorage.getItem('admin_students')) || [];
            const studentExists = students.some(s => s.id_card === id_card);
            if (!studentExists) {
                students.push({
                    id_card: id_card,
                    name: name,
                    license_type: exam_type.split(' - ')[0], // 自動抓取如 "輕型貨車"
                    status: '有效'
                });
                localStorage.setItem('admin_students', JSON.stringify(students));
            }

            alert(`感謝預約，${name}！\n我們已收到你的考試預約：\n【${exam_type} - ${exam_date} ${exam_time_slot}】`);
            
            // 重設表單
            document.getElementById('appointmentForm').reset();
        }
    </script>
    </script>
</body>
</html>

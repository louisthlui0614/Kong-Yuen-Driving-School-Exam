<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>港緣駕駛學院 </title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: "Microsoft JhengHei", "Apple LiGothic Medium", sans-serif;
            color: #1a1a1a;
            background-color: #fdfaf2;
            margin: 0; padding: 0; line-height: 1.6;
        }
        
        /* 導航欄 */
        .navbar {
            background-color: #fffdec;
            border-bottom: 3px solid #e6c229;
            padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .nav-logo { display: flex; align-items: center; gap: 10px; font-size: 16pt; font-weight: bold; color: #000; }
        .nav-logo img { height: 45px; width: auto; }
        .nav-links { display: flex; gap: 20px; list-style: none; margin: 0; padding: 0; }
        .nav-links a { text-decoration: none; color: #333; font-weight: bold; font-size: 11pt; transition: color 0.2s; }
        .nav-links a:hover { color: #e6c229; }
        .btn-admin { background-color: #333; color: #ebdca5 !important; padding: 6px 12px; border-radius: 4px; }
        .btn-admin:hover { background-color: #e6c229; color: #000 !important; }

        /* Hero 橫幅 */
        .hero {
            background: linear-gradient(135deg, #ebdca5 0%, #fdfaf2 100%);
            padding: 80px 5%; text-align: center; border-bottom: 1px solid #ebdca5;
        }
        .hero h1 { font-size: 28pt; margin: 0 0 15px 0; color: #1a1a1a; }
        .hero p { font-size: 14pt; color: #555; margin: 0 0 30px 0; }
        .btn-scroll {
            background-color: #e6c229; color: #000; padding: 12px 30px; font-size: 12pt;
            font-weight: bold; text-decoration: none; border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: background 0.2s, transform 0.2s;
        }
        .btn-scroll:hover { background-color: #d4b220; transform: translateY(-2px); }

        /* 表格區塊 */
        .booking-section { background-color: #fffdec; border-top: 1px solid #ebdca5; padding: 50px 5%; }
        .form-container { max-width: 600px; margin: 0 auto; background-color: #fff; border: 2px solid #e6c229; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 10pt; }
        .form-group input[type="text"], .form-group input[type="tel"], .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 10pt; font-family: inherit; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #e6c229; background-color: #fffdec; }
        .radio-group { display: flex; gap: 15px; margin-top: 5px; }
        .btn-submit { width: 100%; background-color: #e6c229; color: #000; border: none; padding: 12px; font-size: 12pt; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background-color: #d4b220; }
        .btn-submit:disabled { background-color: #ccc; cursor: not-allowed; }

        footer { text-align: center; padding: 30px 5%; font-size: 9pt; color: #666; background-color: #fdfaf2; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">
            <div style="font-size: 24px; margin-right: 5px;">🚗</div>
            港緣駕駛學院
        </div>
        <ul class="nav-links">
            <li><a href="index.html">首頁</a></li>
            <li><a href="#booking">網上預約</a></li>
            <li><a href="check.html">執法查核</a></li>
            <li><a href="admin.html" class="btn-admin">職員後台</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>路政圓緣，穩健啟航</h1>
        <p>提供專業駕駛培訓，高合格率，口碑載道。</p>
        <a href="#booking" class="btn-scroll">立即網上預約考試</a>
    </header>

    <section class="booking-section" id="booking">
        <h2 style="text-align: center; margin-bottom: 30px;">網上預約考試</h2>
        <div class="form-container">
            <form id="appointmentForm" onsubmit="handleBooking(event)">
                <div class="form-group">
                    <label for="name">中文姓名 *</label>
                    <input type="text" id="name" required placeholder="例如：陳大文">
                </div>
                <div class="form-group">
                    <label for="hkid">身份證號碼 *</label>
                    <input type="text" id="hkid" required placeholder="例如：A123456(7)" pattern="^[A-Z]{1,2}[0-9]{6}\(?[0-9A]\)?$" title="請輸入正確的香港身份證格式">
                </div>
                <div class="form-group">
                    <label for="phone">電話號碼 *</label>
                    <input type="tel" id="phone" required placeholder="例如：91234567" pattern="[0-9]{8}">
                </div>
                <div class="form-group">
                    <label>預約考試項目 *</label>
                    <div class="radio-group">
                        <label><input type="radio" name="exam_type" value="輕型貨車" checked> 輕型貨車（包含私家車牌照）</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>傳動系統 *</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gear_type" value="自動波" checked> 自動波</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="preferred_time">首選上課時段</label>
                    <select id="preferred_time">
                        <option value="平日日間 (09:00 - 18:00)">平日日間 (09:00 - 18:00)</option>
                        <option value="平日夜間 (18:00 - 22:00)">平日夜間 (18:00 - 22:00)</option>
                        <option value="週末及公眾假期">週末及公眾假期</option>
                    </select>
                </div>
                <button type="submit" id="submitBtn" class="btn-submit">提交預約申請</button>
            </form>
        </div>
    </section>

    <footer>
        &copy; 2026 港緣駕駛學院 Kong Yuen Driving School. 版權所有。
    </footer>

    <script>
        // 1. 初始化 Supabase 聯動
        const SUPABASE_URL = "https://falyohlekezdbxjnhwcn.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_1CL8M8zn7UDANbvNM0KxNQ_DSNRq1QB";
        const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Discord Webhook 聯動
        const DISCORD_WEBHOOK_URL = "https://discordapp.com/api/webhooks/1506184682893738076/FyeR1FBXdwJnol8EEnkg7OSFzrrg2YKvZkbPNHesgp3B0DoAOmg9IN7juSNyt6CMRAUW";

        // 2. 核心提交邏輯
        async function handleBooking(event) {
            event.preventDefault(); // 阻止網頁跳轉刷新
            
            // 立即改變按鈕狀態（證明 JS 成功運作）
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "提交中...";

            // 讀取前端數據
            const name = document.getElementById('name').value.trim();
            const hkid = document.getElementById('hkid').value.trim().toUpperCase();
            const phone = document.getElementById('phone').value.trim();
            const exam_type = document.querySelector('input[name="exam_type"]:checked').value;
            const gear_type = document.querySelector('input[name="gear_type"]:checked').value;
            const preferred_time = document.getElementById('preferred_time').value;

            const fullExamString = `${exam_type} (${gear_type})`;

            let supabaseSuccess = false;
            let supabaseErrorMsg = "未知錯誤";

            // 【第一步】寫入資料庫 (用 try-catch 隔離，就算爆咗都唔會卡死 Discord)
            try {
                const { data, error } = await supabase
                    .from('appointments')
                    .insert([
                        { 
                            name: name, 
                            hkid: hkid, 
                            phone: phone, 
                            exam_type: fullExamString, 
                            preferred_time: preferred_time 
                        }
                    ]);

                if (error) {
                    console.error("Supabase Error:", error);
                    supabaseErrorMsg = `[SQL錯誤] ${error.code}: ${error.message}`;
                } else {
                    supabaseSuccess = true;
                }
            } catch (dbErr) {
                console.error("Database Connection Exception:", dbErr);
                supabaseErrorMsg = `[連線崩潰] ${dbErr.message}`;
            }

            // 【第二步】不論資料庫成敗，強制衝刺發送 Discord Webhook
            try {
                const statusTitle = supabaseSuccess ? "🔔 收到全新網上預約考試申請！" : "⚠️ [系統警告] 有新預約，但寫入資料庫失敗！";
                
                const discordMessage = {
                    embeds: [{
                        title: statusTitle,
                        color: supabaseSuccess ? 15122985 : 16711680, // 成功=黃色，失敗=紅色
                        fields: [
                            { name: "👤 申請人姓名", value: name, inline: true },
                            { name: "📞 電話號碼", value: phone, inline: true },
                            { name: "🪪 身份證號碼", value: `\`${hkid.substring(0,4)}***(*)\``, inline: true },
                            { name: "🚗 報考項目", value: fullExamString, inline: true },
                            { name: "⏰ 首選時段", value: preferred_time, inline: true }
                        ],
                        footer: { text: `港緣自動化系統 • 數據庫同步狀態: ${supabaseSuccess ? 'SUCCESS' : 'FAILED'}` },
                        timestamp: new Date().toISOString()
                    }]
                };

                // 如果 Supabase 失敗，將背後的原因直接附在 Discord 裡面，方便職員立即知道
                if (!supabaseSuccess) {
                    discordMessage.embeds[0].fields.push({
                        name: "❌ 數據庫回報之錯誤原因",
                        value: `\`\`\`${supabaseErrorMsg}\`\`\``,
                        inline: false
                    });
                }

                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(discordMessage)
                });

            } catch (discordErr) {
                console.error("Discord Webhook Send Failed:", discordErr);
            }

            // 【第三步】彈出前端提示通知用戶
            if (supabaseSuccess) {
                alert(`感謝你，${name}！\n預約申請已成功提交，資料已寫入系統，職員頻道亦已收到通知。`);
                document.getElementById('appointmentForm').reset();
            } else {
                // 將資料庫拒絕的原因直接以 Alert 彈出
                alert(`⚠️ 系統提示：資料已嘗試送出，但資料庫同步失敗。\n\n錯誤原因：\n${supabaseErrorMsg}\n\n* 職員渠道已收到此失敗報告並會手動處理您的預約。`);
            }

            // 恢復按鈕狀態
            submitBtn.disabled = false;
            submitBtn.innerText = "提交預約申請";
        }
    </script>
</body>
</html>

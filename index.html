<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>港緣駕駛學院</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;700&display=swap');

        body { font-family: 'Noto Sans HK', sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; color: #333; }
        
        /* Header - 調整背景色為極淡藍色 */
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 80px; 
            background: #eef6ff; /* 極淡的藍色背景 */
            border-bottom: 2px solid #dbeafe; 
        }

        /* Logo 連結效果 */
        .logo-link { display: flex; align-items: center; gap: 15px; text-decoration: none; color: #003366; }
        .logo-container { display: flex; align-items: center; gap: 15px; font-weight: 700; font-size: 1.5rem; }
        .logo-container img { height: 50px; transition: transform 0.2s; }
        .logo-link:hover img { transform: scale(1.05); } /* 滑鼠移上 logo 時的提示 */

        .topbar a { margin-left: 30px; text-decoration: none; color: #555; font-weight: 600; transition: color 0.3s; }
        .topbar a:hover { color: #ff6600; }
        
        /* Intro */
        .intro { padding: 80px 20px; text-align: center; background: white; }
        .intro h1 { color: #003366; font-size: 2.5rem; margin-bottom: 20px; }
        .intro img { max-width: 700px; width: 100%; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.15); margin: 30px 0; }
        
        /* Features */
        .features { display: flex; justify-content: space-around; padding: 60px 80px; background: #f4f7f6; }
        .feature-item { text-align: center; max-width: 300px; }
        .feature-item h3 { color: #003366; }

        /* Button */
        .btn-reserve { display: inline-block; padding: 18px 40px; background: #ff6600; color: white; text-decoration: none; border-radius: 50px; font-weight: bold; transition: transform 0.2s, background 0.3s; }
        .btn-reserve:hover { background: #e65c00; transform: scale(1.05); }

        /* Footer */
        footer { padding: 40px; background: #003366; color: white; text-align: center; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <!-- 將 logo 和文字包在一個連結內 -->
        <a href="index.html" class="logo-link">
            <div class="logo-container">
                <img src="logo.png" alt="Logo">
                <span>\</span>
            </div>
        </a>
        
        <nav class="topbar">
            <a href="#">首頁</a>
            <a href="#">網上預約</a>
            <a href="#">駕駛執照查核</a>
        </nav>
    </header>

    <section class="intro">
        <h1>專業駕駛 啟航未來</h1>
        <p>港緣駕駛學院致力於提供專業、安全的駕駛培訓服務。<br>擁有資深教練團隊及現代化教學設施，助您順利考取駕駛執照。</p>
        <img src="駕駛考試路線圖.png" alt="學院簡介圖片">
        <br>
        <a href="#" class="btn-reserve">立即預約考試</a>
    </section>

    <section class="features">
        <div class="feature-item">
            <h3>經驗豐富教練</h3>
            <p>每位教練均擁有多年的教學經驗，針對不同學員需求提供細心指導。</p>
        </div>
        <div class="feature-item">
            <h3>現代化車隊</h3>
            <p>採用全新訓練車輛，並配備最新安全輔助系統，確保教學質素。</p>
        </div>
        <div class="feature-item">
            <h3>靈活預約制度</h3>
            <p>支援網上預約與即時查核，讓學員更有效安排練習時間。</p>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 港緣駕駛學院. All Rights Reserved.</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>港緣駕駛學院</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; margin: 0; padding: 0; }
        
        /* 頂部區域 */
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background: #f8f8f8; }
        .logo-container { display: flex; align-items: center; gap: 15px; font-weight: bold; font-size: 1.5rem; }
        .logo-container img { height: 50px; }
        .topbar a { margin-left: 20px; text-decoration: none; color: #333; font-weight: bold; }
        
        /* 簡介區域 */
        .intro { padding: 50px; text-align: center; }
        .intro img { max-width: 600px; width: 100%; border-radius: 10px; margin: 20px 0; }
        
        /* 按鈕 */
        .btn-reserve { display: inline-block; padding: 15px 30px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.png" alt="港緣駕駛學院 Logo">
            <span>港緣駕駛學院</span>
        </div>
        <nav class="topbar">
            <a href="#">首頁</a>
            <a href="#">網上預約</a>
            <a href="#">駕駛執照查核</a>
        </nav>
    </header>

    <section class="intro">
        <h1>學院簡介</h1>
        <p>港緣駕駛學院致力於提供專業、安全的駕駛培訓服務。我們擁有資深的教練團隊及現代化的教學設施，助您順利考取駕駛執照。</p>
        
        <!-- 這是之後要替換的相片 -->
        <img src="https://via.placeholder.com/600x300?text=學院環境照片" alt="學院簡介圖片">
        
        <br>
        <a href="#" class="btn-reserve">立即預約考試</a>
    </section>

</body>
</html>

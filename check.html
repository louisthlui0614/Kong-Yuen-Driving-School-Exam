<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>執法部門搜尋 - 運輸署</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
    const SUPABASE_URL = 'https://egevptrvdatxpwxpwxhi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Ps1KBwIxcfKBrwQkIUcvhA_DWEQbomo';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    const DISCORD_WEBHOOK_URL = 'https://discordapp.com/api/webhooks/1506288384111284366/8k-Cel4iTV2UqpPEexCWe_zigDmLSkpnZdE-Qq9ALpQk931Izh589FHOp4a5IDn12y2s';
    
    let currentPoliceUser = ""; 
    </script>

    <style>
        body { font-family: 'Noto Sans HK', sans-serif; margin: 0; background-color: #f4f7f6; }
        header { padding: 20px 80px; background: #eef6ff; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .logo-link { text-decoration: none; color: #003366; font-weight: 700; font-size: 1.5rem; }
        .container { max-width: 800px; margin: 30px auto; padding: 30px; background: white; border-radius: 10px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { padding: 10px; flex-grow: 1; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #003366; color: white; border: none; cursor: pointer; border-radius: 5px; }
        .score-input { width: 80px; padding: 5px; }
        footer { padding: 40px; background: #003366; color: white; text-align: center; margin-top: 50px; }
        #auth-screen { text-align: center; padding: 50px; }
        #search-screen { display: none; }
    </style>
</head>
<body>

    <header>
        <a href="check.html" class="logo-link">港緣運輸署</a>
        <nav class="topbar">
            <a href="check.html">首頁</a>
        </nav>
    </header>

    <div id="auth-screen" class="container">
        <h2>執法部門登入</h2>
        <input type="text" id="p_user" placeholder="帳號">
        <input type="password" id="p_pass" placeholder="密碼">
        <button onclick="loginPolice()">登入</button>
    </div>

    <div id="search-screen" class="container">
        <h2>駕駛人士搜尋</h2>
        <div class="search-box">
            <input type="text" id="query" placeholder="輸入姓名或身份證號碼...">
            <button onclick="searchDriver()">搜尋</button>
        </div>
        <div id="result"></div>
    </div>

    <footer><p>&copy; 2026 港緣運輸署. All Rights Reserved.</p></footer>

    <script>
        async function loginPolice() {
            const user = document.getElementById('p_user').value;
            const pass = document.getElementById('p_pass').value;
            const { data, error } = await supabaseClient.from('police_accounts').select('*').eq('username', user).eq('password', pass).single();
            if (data) {
                currentPoliceUser = user;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('search-screen').style.display = 'block';
            } else { alert("認證失敗或帳號錯誤"); }
        }

        async function searchDriver() {
            const rawQuery = document.getElementById('query').value.trim();
            if (!rawQuery) return alert("請輸入搜尋內容");
            const cleanQuery = rawQuery.replace(/[\(\)]/g, '%');

            const { data, error } = await supabaseClient
                .from('driver_records')
                .select('*')
                .or(`name.ilike.%${cleanQuery}%,hkid.ilike.%${cleanQuery}%`);
            
            const res = document.getElementById('result');
            if (error) { console.error("搜尋發生錯誤:", error); return; }
            
            res.innerHTML = data && data.length ? '' : '找不到記錄';
            data?.forEach(d => {
                const isInvalid = d.status === '無效';
                res.innerHTML += `
                    <div style="border:2px solid ${isInvalid ? 'red' : '#ddd'}; padding:15px; margin-top:10px;" id="record_${d.id}">
                        <p><strong>姓名:</strong> ${d.name} | <strong>身份證:</strong> ${d.hkid}</p>
                        <p><strong>牌照:</strong> ${d.license_type || '無'}</p>
                        <p><strong>狀態:</strong> ${d.status}</p>
                        <p><strong>分數:</strong> <input type="number" id="score_${d.id}" value="${d.score || 0}" class="score-input">
                        <button onclick="updateData('${d.id}', '${d.name}', 'score')">更新分數</button></p>
                        ${isInvalid ? '' : `<button onclick="updateData('${d.id}', '${d.name}', 'status')">更改為無效</button>`}
                    </div>`;
            });
        }

        async function updateData(id, name, type) {
            let updatePayload = {};
            let displayStatus = "";

            if (type === 'score') {
                const val = document.getElementById('score_' + id).value;
                updatePayload = { score: parseInt(val) };
                displayStatus = "分數更新為 " + val;
            } else {
                updatePayload = { status: '無效' };
                displayStatus = "狀態更新為 無效";
            }
            
            // 關鍵修正：確保這裡 id 是以字串形式傳入 .eq()
            const { error } = await supabaseClient
                .from('driver_records')
                .update(updatePayload)
                .eq('id', id);
            
            if (!error) {
                sendDiscordNotification(name, displayStatus, currentPoliceUser);
                alert("更新成功");
                searchDriver();
            } else {
                console.error("更新詳細錯誤:", error);
                alert("更新失敗: " + (error.message || "請檢查欄位權限"));
            }
        }

        async function sendDiscordNotification(name, action, officer) {
            const payload = {
                content: `🚨 **駕駛記錄變動**\n修改人: ${officer}\n目標: ${name}\n操作: **${action}**\n時間: ${new Date().toLocaleString()}`
            };
            await fetch(DISCORD_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.error("Discord 通知失敗", err));
        }
    </script>
</body>
</html>

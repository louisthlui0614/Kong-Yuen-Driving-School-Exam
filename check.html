<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>港緣駕駛學院 - 駕駛執照有效性核對系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: "Microsoft JhengHei", "Apple LiGothic Medium", sans-serif;
            color: #1a1a1a;
            background-color: #f4f1e6;
            margin: 0; padding: 0; line-height: 1.6;
        }
        
        /* 導航欄 */
        .navbar {
            background-color: #333;
            padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
        }
        .nav-logo { display: flex; align-items: center; gap: 10px; font-size: 14pt; font-weight: bold; color: #ebdca5; }
        .nav-logo img { height: 40px; width: auto; }
        .nav-links { display: flex; gap: 20px; list-style: none; margin: 0; padding: 0; }
        .nav-links a { text-decoration: none; color: #ebdca5; font-weight: bold; font-size: 11pt; }
        .nav-links a:hover { color: #fff; }

        /* 查詢主區塊 */
        .check-container {
            max-width: 550px;
            margin: 60px auto;
            background-color: #fff;
            border: 2px solid #333;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .check-title { text-align: center; font-size: 18pt; margin-bottom: 10px; color: #222; }
        .check-subtitle { text-align: center; font-size: 10pt; color: #666; margin-bottom: 30px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 10pt; color: #333; }
        .form-group input[type="text"] { width: 100%; padding: 12px; border: 1px solid #999; border-radius: 4px; font-size: 11pt; }
        .form-group input:focus { outline: none; border-color: #333; background-color: #fffdec; }
        
        .btn-check { width: 100%; background-color: #333; color: #ebdca5; border: none; padding: 14px; font-size: 12pt; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .btn-check:hover { background-color: #000; color: #fff; }
        .btn-check:disabled { background-color: #999; color: #ccc; cursor: not-allowed; }

        /* 結果顯示區域 */
        .result-box {
            margin-top: 25px; padding: 20px; border-radius: 6px; display: none; text-align: left; font-size: 11pt; line-height: 1.8;
        }
        
        footer { text-align: center; padding: 20px; font-size: 9pt; color: #777; position: fixed; bottom: 0; width: 100%; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">
            <img src="logo.png" alt="港緣 Logo">
            港緣系統 - 執法查核專用
        </div>
        <ul class="nav-links">
            <li><a href="index.html">返回學院首頁</a></li>
        </ul>
    </nav>

    <div class="check-container">
        <div class="check-title">駕駛執照有效性核對</div>
        <div class="check-subtitle">經授權之執法人員請輸入持牌人【姓名】或【身份證號碼】進行即時連線核對。</div>
        
        <form id="licenseCheckForm" onsubmit="handleLicenseCheck(event)">
            <div class="form-group">
                <label for="check_name">持牌人姓名</label>
                <input type="text" id="check_name" placeholder="例如：陳大文">
            </div>
            <div class="form-group">
                <label for="check_hkid">持牌人身份證號碼</label>
                <input type="text" id="check_hkid" placeholder="例如：A123456(7)">
            </div>
            <button type="submit" id="checkBtn" class="btn-check">即時核對執照狀態</button>
        </form>
        
        <div id="checkResult" class="result-box"></div>
    </div>

    <footer>
        &copy; 2026 港緣駕駛學院資訊系統 - 僅供授權部門查核使用。
    </footer>

    <script>
        // 1. 初始化 Supabase (對接你的真實資料庫)
        const SUPABASE_URL = "https://falyohlekezdbxjnhwcn.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_1CL8M8zn7UDANbvNM0KxNQ_DSNRq1QB";
        const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleLicenseCheck(event) {
            event.preventDefault();
            
            const checkName = document.getElementById('check_name').value.trim();
            let checkHkid = document.getElementById('check_hkid').value.trim().toUpperCase();
            const resultDiv = document.getElementById('checkResult');
            const checkBtn = document.getElementById('checkBtn');

            // 1. 安全檢查：確保使用者至少填寫了一個欄位
            if (!checkName && !checkHkid) {
                showResult("⚠️ 請至少輸入「持牌人姓名」或「身份證號碼」其中一項欄位。", "#fff3cd", "#856404", "#ffeeba");
                return;
            }

            // 按鈕動態效果
            checkBtn.disabled = true;
            checkBtn.innerText = "連線核對中...";

            try {
                // 2. 構建 Supabase 查詢條件
                let query = supabase.from('students').select('*');
                
                if (checkName) {
                    query = query.eq('name', checkName);
                }
                
                // 執行查詢
                const { data: students, error } = await query;

                if (error) throw error;

                // 3. 篩選與比對 (特別針對身份證格式做模糊與精確處理)
                let matchedStudent = null;

                if (students && students.length > 0) {
                    if (checkHkid) {
                        // 清除特殊字元以便進行乾淨的比對 (例如 A1234567)
                        const cleanInputHkid = checkHkid.replace(/[^A-Z0-9]/g, '');
                        
                        matchedStudent = students.find(s => {
                            const cleanDbHkid = s.hkid.toUpperCase().replace(/[^A-Z0-9]/g, '');
                            return cleanDbHkid.includes(cleanInputHkid) || cleanInputHkid.includes(cleanDbHkid);
                        });
                    } else {
                        // 如果沒填 HKID，只憑姓名匹配，就抓第一個符合的
                        matchedStudent = students[0];
                    }
                }

                // 4. 渲染結果
                if (matchedStudent) {
                    // 根據資料庫內的 is_valid 狀態顯示綠色或紅色
                    if (matchedStudent.is_valid) {
                        const pdfHtml = matchedStudent.pdf_url 
                            ? `<br><b>📄 關聯文件紀錄：</b><a href="${matchedStudent.pdf_url}" target="_blank" style="color: #155724; font-weight: bold;">點擊檢視歸檔 PDF</a>`
                            : '';

                        showResult(`
                            <strong style="font-size: 14pt;">🟢 驗證結果：執照有效</strong><br><br>
                            <b>持牌人姓名：</b>${matchedStudent.name}<br>
                            <b>身份證號碼：</b>${matchedStudent.hkid.substring(0,4)}***(*)<br>
                            <b>駕駛執照狀態：</b>有效 (VALID)<br>
                            <b>已登記可駕駛類別：</b>${matchedStudent.vehicle_classes || '未設定'}${pdfHtml}<br>
                            <small style="color: #666; display:block; margin-top:10px;">* 本結果由港緣學院後台系統即時動態提供。</small>
                        `, "#d4edda", "#155724", "#c3e6cb");
                    } else {
                        showResult(`
                            <strong style="font-size: 14pt;">🔴 驗證結果：此執照已被停用/失效</strong><br><br>
                            <b>持牌人姓名：</b>${matchedStudent.name}<br>
                            <b>駕駛執照狀態：</b>已停用/失效 (INVALID)<br>
                            <small style="color: #666; display:block; margin-top:10px;">管理提示：該學員已被後台系統限制權限。</small>
                        `, "#f8d7da", "#721c24", "#f5c6cb");
                    }
                } else {
                    showResult(`
                        <strong style="font-size: 14pt;">🔴 驗證結果：無效或查無此人</strong><br><br>
                        系統資料庫內未有對應此輸入資料之正式學員或有效駕駛執照紀錄。
                    `, "#f8d7da", "#721c24", "#f5c6cb");
                }

            } catch (err) {
                console.error(err);
                showResult(`❌ 系統連線失敗：${err.message}`, "#f8d7da", "#721c24", "#f5c6cb");
            } finally {
                checkBtn.disabled = false;
                checkBtn.innerText = "即時核對執照狀態";
            }
        }

        function showResult(htmlContent, bgColor, textColor, borderColor) {
            const resultDiv = document.getElementById('checkResult');
            resultDiv.style.display = "block";
            resultDiv.style.backgroundColor = bgColor;
            resultDiv.style.color = textColor;
            resultDiv.style.border = `2px solid ${borderColor}`;
            resultDiv.innerHTML = htmlContent;
        }
    </script>
</body>
</html>

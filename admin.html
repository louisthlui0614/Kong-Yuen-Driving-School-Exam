<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>管理後台 - 港緣駕駛學院</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    
    <script>
        // 【重要】請務必將這兩行替換成你後台的真實 URL 和 Key
        const SUPABASE_URL = 'https://你的專案ID.supabase.co';
        const SUPABASE_KEY = '你的ANON_KEY';

        // 初始化
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    </script>

    <style>
        body { font-family: 'Noto Sans HK', sans-serif; background: #f4f7f6; margin: 0; }
        header { padding: 20px 80px; background: #eef6ff; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1000px; margin: 30px auto; padding: 20px; background: white; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #003366; color: white; }
        #calendar { margin-top: 50px; background: white; padding: 20px; border-radius: 10px; }
        #admin-content { display: none; }
        .login-box { text-align: center; padding: 100px; }
        input { padding: 10px; margin: 10px; width: 200px; }
        button { padding: 10px 20px; background: #ff6600; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <header><div class="logo-container"><strong>港緣駕駛學院後台</strong></div></header>

    <div id="login-screen" class="login-box">
        <h2>管理員登入</h2>
        <input type="text" id="username" placeholder="用戶名">
        <input type="password" id="password" placeholder="密碼">
        <br>
        <button onclick="login()">登入</button>
    </div>

    <div id="admin-content" class="container">
        <h2>駕駛人士記錄</h2>
        <table id="driverTable">
            <thead>
                <tr><th>姓名</th><th>身份證</th><th>電話</th><th>牌照</th><th>狀態</th><th>PDF</th></tr>
            </thead>
            <tbody></tbody>
        </table>
        <div id='calendar'></div>
    </div>

    <script>
        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            const { data, error } = await supabaseClient
                .from('admin_users')
                .select('*')
                .eq('username', user)
                .eq('password', pass)
                .single();

            if (data) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                loadData();
            } else {
                alert("帳號或密碼錯誤！" + (error ? "\n" + error.message : ""));
            }
        }

        async function loadData() {
            // 載入駕駛記錄
            const { data: drivers } = await supabaseClient.from('driver_records').select('*');
            const tbody = document.querySelector('#driverTable tbody');
            tbody.innerHTML = ''; // 清空舊內容
            drivers?.forEach(d => {
                tbody.innerHTML += `<tr><td>${d.name}</td><td>${d.hkid}</td><td>${d.phone}</td><td>${d.license_type}</td><td>${d.status}</td><td><a href="${d.pdf_url}" target="_blank">檢視</a></td></tr>`;
            });

            // 載入預約記錄
            const { data: bookings } = await supabaseClient.from('bookings').select('*');
            const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                initialView: 'dayGridMonth',
                events: bookings?.map(b => ({ title: b.name, start: b.date }))
            });
            calendar.render();
        }
    </script>
</body>
</html>

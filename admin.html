<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>管理後台 - 港緣駕駛學院</title>
    <!-- 1. 引入庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    
    <script>
        // 2. 避免與庫本身衝突，改用 supabaseClient 命名
        const supabaseClient = supabase.createClient('YOUR_SUPABASE_URL', 'YOUR_SUPABASE_ANON_KEY');

        // 3. 確保函式掛在 window 上，HTML 的 onclick 才能找到
        window.loginWithDiscord = async function() {
            const { error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'discord',
                options: { redirectTo: window.location.href }
            });
            if (error) alert(error.message);
        };
    </script>

    <style>
        body { font-family: 'Noto Sans HK', sans-serif; background: #f4f7f6; margin: 0; }
        header { padding: 20px 80px; background: #eef6ff; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1000px; margin: 30px auto; padding: 20px; background: white; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #003366; color: white; }
        #calendar { margin-top: 50px; background: white; padding: 20px; border-radius: 10px; }
        #admin-content { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container"><strong>港緣駕駛學院後台</strong></div>
    </header>

    <div id="login-screen" style="text-align:center; padding: 100px;">
        <h2>請登入以管理系統</h2>
        <button onclick="loginWithDiscord()" style="padding:15px 30px; background:#5865F2; color:white; border:none; border-radius:5px; cursor:pointer;">
            使用 Discord 登入
        </button>
    </div>

    <div id="admin-content" class="container">
        <h2>駕駛人士記錄</h2>
        <table id="driverTable">
            <thead>
                <tr><th>姓名</th><th>身份證</th><th>電話</th><th>牌照</th><th>狀態</th><th>PDF</th></tr>
            </thead>
            <tbody></tbody>
        </table>
        <div id='calendar'></div>
    </div>

    <script>
        async function checkAdminStatus() {
            // 4. 使用修正後的 supabaseClient
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return;

            const user = session.user;
            const discordId = user.identities[0].id;

            const { data: admin } = await supabaseClient
                .from('admins')
                .select('*')
                .eq('discord_id', discordId)
                .single();

            if (admin) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                loadData();
            } else {
                alert("您沒有權限！");
                await supabaseClient.auth.signOut();
            }
        }

        async function loadData() {
            const { data: drivers } = await supabaseClient.from('driver_records').select('*');
            const tbody = document.querySelector('#driverTable tbody');
            drivers?.forEach(d => {
                tbody.innerHTML += `<tr><td>${d.name}</td><td>${d.hkid}</td><td>${d.phone}</td><td>${d.license_type}</td><td>${d.status}</td><td><a href="${d.pdf_url}" target="_blank">檢視</a></td></tr>`;
            });

            const { data: bookings } = await supabaseClient.from('bookings').select('*');
            const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                initialView: 'dayGridMonth',
                events: bookings?.map(b => ({ title: b.name, start: b.date }))
            });
            calendar.render();
        }

        checkAdminStatus();
    </script>
</body>
</html>

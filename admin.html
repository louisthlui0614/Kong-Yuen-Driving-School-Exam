<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>管理後台 - 港緣駕駛學院</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 引入 FullCalendar -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <style>
        body { font-family: 'Noto Sans HK', sans-serif; background: #f4f7f6; margin: 0; }
        header { padding: 20px 80px; background: #eef6ff; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1000px; margin: 30px auto; padding: 20px; background: white; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #003366; color: white; }
        #calendar { margin-top: 50px; background: white; padding: 20px; border-radius: 10px; }
        footer { padding: 40px; background: #003366; color: white; text-align: center; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container"><strong>港緣駕駛學院後台</strong></div>
    </header>

    <div class="container">
        <h2>駕駛人士記錄</h2>
        <table id="driverTable">
            <thead>
                <tr><th>姓名</th><th>身份證</th><th>電話</th><th>牌照</th><th>狀態</th><th>PDF</th></tr>
            </thead>
            <tbody></tbody>
        </table>

        <div id='calendar'></div>
    </div>

    <footer><p>&copy; 2026 港緣駕駛學院 Admin Panel.</p></footer>

   <script>
    const supabase = supabase.createClient('YOUR_SUPABASE_URL', 'YOUR_SUPABASE_ANON_KEY');

    // 檢查登入狀態
    async function checkAuth() {
        const { data: { user } } = await supabase.auth.getUser();
        
        if (!user) {
            // 如果沒登入，顯示登入按鈕
            document.body.innerHTML = `
                <div style="text-align:center; padding-top:100px;">
                    <h1>請先登入</h1>
                    <button onclick="loginWithDiscord()" style="padding:15px 30px; background:#5865F2; color:white; border:none; cursor:pointer;">
                        使用 Discord 登入
                    </button>
                </div>
            `;
        }
    }

    // 觸發 Discord 登入
    async function loginWithDiscord() {
        const { error } = await supabase.auth.signInWithOAuth({
            provider: 'discord',
            options: {
                redirectTo: window.location.href // 跳轉回當前頁面
            }
        });
        if (error) alert(error.message);
    }

    checkAuth();
</script>
</body>
</html>

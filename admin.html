<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>管理後台 - 港緣駕駛學院</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    
    <script>
        const SUPABASE_URL = 'https://egevptrvdatxpwxpwxhi.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Ps1KBwIxcfKBrwQkIUcvhA_DWEQbomo'; // 請務必使用你的 anon key
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    </script>

    <style>
        body { font-family: 'Noto Sans HK', sans-serif; margin: 0; background-color: #f4f7f6; }
        header { padding: 20px 80px; background: #eef6ff; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .logo-link { text-decoration: none; color: #003366; font-weight: 700; font-size: 1.5rem; }
        .container { max-width: 1000px; margin: 30px auto; padding: 20px; background: white; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #003366; color: white; }
        #calendar { margin-top: 50px; background: white; padding: 20px; border-radius: 10px; }
        #admin-content { display: none; }
        .login-box { text-align: center; padding: 100px; }
        input { padding: 8px; margin: 5px; }
        button { padding: 8px 15px; background: #ff6600; color: white; border: none; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-link">港緣駕駛學院後台</a>
    </header>

    <div id="login-screen" class="login-box">
        <h2>管理員登入</h2>
        <input type="text" id="username" placeholder="用戶名">
        <input type="password" id="password" placeholder="密碼">
        <button onclick="login()">登入</button>
    </div>

    <div id="admin-content" class="container">
        <h2>駕駛人士記錄</h2>
        <table id="driverTable">
            <thead>
                <tr><th>姓名</th><th>身份證</th><th>電話</th><th>牌照</th><th>狀態</th><th>操作</th></tr>
            </thead>
            <tbody></tbody>
        </table>
        <div id='calendar'></div>
    </div>

    <script>
        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            // 建議後續改用 Supabase Auth，這裡暫時使用查詢檢查
            const { data, error } = await supabaseClient.from('admin_users').select('*').eq('username', user).eq('password', pass).single();
            if (data) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                loadData();
            } else { alert("帳號或密碼錯誤！"); }
        }

        async function loadData() {
            // 載入駕駛記錄
            const { data: drivers } = await supabaseClient.from('driver_records').select('*');
            const tbody = document.querySelector('#driverTable tbody');
            tbody.innerHTML = '';
            drivers?.forEach(d => {
                tbody.innerHTML += `<tr>
                    <td><input type="text" value="${d.name}" id="name_${d.id}"></td>
                    <td><input type="text" value="${d.hkid}" id="hkid_${d.id}"></td>
                    <td><input type="text" value="${d.phone}" id="phone_${d.id}"></td>
                    <td><input type="text" value="${d.license_type}" id="lic_${d.id}"></td>
                    <td><select id="stat_${d.id}"><option ${d.status=='有效'?'selected':''}>有效</option><option ${d.status=='無效'?'selected':''}>無效</option></select></td>
                    <td><button onclick="updateRecord('${d.id}')">更新</button></td>
                </tr>`;
            });

            // 載入預約記錄 (修正欄位名稱: exam_date, exam_slot)
            const { data: bookings } = await supabaseClient.from('bookings').select('*');
            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                events: bookings?.map(b => ({
                    title: `${b.name} (${b.exam_slot})`,
                    start: b.exam_date 
                }))
            });
            calendar.render();
        }

        async function updateRecord(id) {
            const { error } = await supabaseClient.from('driver_records')
                .update({ 
                    name: document.getElementById('name_'+id).value,
                    hkid: document.getElementById('hkid_'+id).value,
                    phone: document.getElementById('phone_'+id).value,
                    license_type: document.getElementById('lic_'+id).value,
                    status: document.getElementById('stat_'+id).value 
                })
                .eq('id', id);

            if (error) alert("更新失敗: " + error.message);
            else alert("更新成功！");
        }
    </script>
</body>
</html>
